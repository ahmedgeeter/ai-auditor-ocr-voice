services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meridian_backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VISION_MODEL=${VISION_MODEL:-qwen/qwen3.8-27b}
      - REASONING_MODEL=${REASONING_MODEL:-openai/gpt-oss-120b}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-large-v3}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meridian_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
